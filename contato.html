<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Esperança - Contato</title>
    <meta name="description" content="Entre em contato com a ONG Esperança e saiba como ajudar.">
</head>
<body>
    <header>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos Sociais</a></li>
                <li><a href="contato.html" aria-current="page">Contato</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="contato-title">
            <h1 id="contato-title">Fale Conosco</h1>
            <p>Tem dúvidas, quer ser voluntário ou fazer uma doação? Preencha o formulário abaixo.</p>

            <form action="#" method="post">
                <div>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="mensagem">Sua mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </div>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
