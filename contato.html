    <header>
        <nav aria-label="Navegação principal">
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Abrir menu de navegação">
                <span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <ul class="nav-list" id="primary-navigation">
                <li><a href="index.html">Início</a></li>

                    <button class="dropdown-toggle" type="button" aria-expanded="false" aria-controls="projects-submenu" aria-label="Abrir submenu de Projetos Sociais">

    <main>
        <section aria-labelledby="contato-title">
            <h1 id="contato-title">Fale Conosco</h1>
            <p>Tem dúvidas, quer ser voluntário ou fazer uma doação? Preencha o formulário abaixo.</p>

            <form action="#" method="post" data-interactive-form novalidate>
                <div>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="mensagem">Sua mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </div>
                <button type="submit">Enviar Mensagem</button>
                <p class="form-feedback" data-form-feedback role="status" aria-live="polite" aria-atomic="true"></p>
            </form>
        </section>
    </main>

    <footer>

    </footer>
